buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath 'com.android.tools.build:gradle:8.13.2'
  }
}

apply plugin: 'com.android.application'

android {
  namespace 'com.tbd.forkfront'
  compileSdk 35

  defaultConfig {
    applicationId "com.tbd.UnNetHack"
    minSdk 21
    targetSdk 35
    versionCode 5200
    versionName "5.2.0"
  }

  sourceSets {
    main {
      manifest.srcFile 'AndroidManifest.xml'
      java.srcDirs = ['src']
      res.srcDirs = ['res']
      assets.srcDirs = ['assets']
      jniLibs.srcDirs = ['libs']
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  externalNativeBuild {
    ndkBuild {
      path "jni/Android.mk"
    }
  }
}

dependencies {
  implementation 'androidx.appcompat:appcompat:1.7.0'
  implementation 'com.google.android.material:material:1.12.0'
  implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
  implementation 'cz.msebera.android:httpclient:4.5.8'
}

tasks.register('copyNativeFiles') {
    group = "setup"
    doLast {
        def rootDir = projectDir.parentFile.parentFile
        copy {
            from rootDir
            include "sys/android/Makefile.top", "sys/android/Makefile.dat", "sys/android/Makefile.doc", "sys/android/Makefile.src", "sys/android/Makefile.utl"
            into rootDir
            rename 'Makefile.top', 'Makefile'
        }
        copy { from "${rootDir}/sys/android/Makefile.dat"; into "${rootDir}/dat"; rename 'Makefile.dat', 'Makefile' }
        copy { from "${rootDir}/sys/android/Makefile.doc"; into "${rootDir}/doc"; rename 'Makefile.doc', 'Makefile' }
        copy { from "${rootDir}/sys/android/Makefile.src"; into "${rootDir}/src"; rename 'Makefile.src', 'Makefile' }
        copy { from "${rootDir}/sys/android/Makefile.utl"; into "${rootDir}/util"; rename 'Makefile.utl', 'Makefile' }
    }
}

tasks.register('updateAssets') {
    group = "setup"
    doLast {
        def rootDir = projectDir.parentFile.parentFile
        def assetsDir = file("assets/nethack")
        if (!assetsDir.exists()) assetsDir.mkdirs()
        
        def datDir = file("${rootDir}/dat")
        if (!datDir.exists()) {
            throw new GradleException("Source data directory not found at: ${datDir.absolutePath}. Did you run setup.sh?")
        }

        // 1. Copy generated game data
        copy {
            from datDir
            include "data", "rumors", "oracles", "quest.dat", "dungeon", "help", "hh", "cmdhelp", "history", "opthelp", "wizhelp", "license"
            include "*.lev"
            into assetsDir
        }
        
        // 2. Copy the default config file
        copy {
            from projectDir
            include "defaults.unh"
            into assetsDir
        }
        
        // 3. Create a version file in root assets
        def verFile = new File(file("assets"), "ver")
        if (!verFile.exists()) {
            verFile.text = "5.2.0"
        }

        def dungeonFile = new File(assetsDir, "dungeon")
        if (!dungeonFile.exists()) {
            println "WARNING: 'dungeon' file not found in assets. The game will fail to start. Ensure you have built the NetHack data files in the 'dat' directory."
        } else {
            println "Assets updated successfully in: ${assetsDir.absolutePath}"
        }
    }
}
